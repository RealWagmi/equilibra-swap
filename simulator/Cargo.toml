[package]
name = "equilibra-offchain-simulator"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
num-bigint = "0.4.6"
num-traits = "0.2.19"
num-integer = "0.1"
axum = "0.8.8"
tokio = { version = "1.51.0", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync", "time"] }
tower-http = { version = "0.6.8", features = ["fs"] }
sha2 = "0.11.0"
rand = "0.10.0"
futures-util = "0.3.32"
primitive-types = "0.12"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
# `panic = "unwind"` matches the strategy of `hyper_util` / `tokio` /
# `axum` transitive deps. Using `abort` here makes the release build of
# the dashboard binaries refuse to link, so the hardhat parity harness
# (which calls `cargo build --release --bins`) fails before any test
# runs.
panic = "unwind"
