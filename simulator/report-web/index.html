<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMM Benchmark Report</title>
    <link rel="stylesheet" href="styles.css?v=4" />
    <!-- Vendored locally (no CDN): the per-run report bundle must stay
         self-contained and render offline / air-gapped. -->
    <script src="vendor/chart.umd.min.js"></script>
    <script src="vendor/chartjs-adapter-date-fns.bundle.min.js"></script>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="metadata" id="metadata">
          <span class="meta-item">Loading...</span>
        </div>
      </header>

      <div class="controls">
        <div class="control-group">
          <label for="poolSelector">Pool:</label>
          <!-- Options are populated from metrics.json metadata.poolList -->
          <select id="poolSelector"></select>
        </div>
        <div class="control-group">
          <label>AMMs:</label>
          <div class="amm-toggles" id="ammToggles"></div>
        </div>
      </div>

      <section class="section">
        <div class="charts-grid">
          <div class="chart-container">
            <h3>LP Value (USD)</h3>
            <canvas id="ilChart"></canvas>
          </div>
          <div class="chart-container">
            <div class="chart-header">
              <h3>LP Composition</h3>
              <!-- Option labels are filled with the pool's actual token
                   symbols from report metadata -->
              <select id="compositionTokenSelector" class="chart-select">
                <option value="quote">Quote</option>
                <option value="base">Base</option>
              </select>
            </div>
            <canvas id="lpCompositionChart"></canvas>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="tables-container">
          <div class="table-wrapper" style="grid-column: 1 / -1">
            <table id="lpPositionTable" class="data-table">
              <thead>
                <tr>
                  <th>AMM</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="controls-row">
          <label for="emaPeriod">Smoothing:</label>
          <!-- Options are populated from the run's series metadata.emaPeriods -->
          <select id="emaPeriod"></select>
          <div class="marker-toggles">
            <span class="marker-label">Markers:</span>
            <label class="marker-toggle marker-equilibra">
              <input type="checkbox" id="showEquilibraRecentering" checked />
              <span>Equilibra recenter</span>
            </label>
            <label class="marker-toggle marker-curve">
              <input type="checkbox" id="showCurveRecentering" checked />
              <span>YieldBasis rebalance</span>
            </label>
            <label class="marker-toggle">
              <input type="checkbox" id="showAnchorDeviation" checked />
              <span>LP-oracle error</span>
            </label>
          </div>
        </div>
        <div class="charts-grid">
          <div class="chart-container">
            <h3>Price History</h3>
            <canvas id="deviationChart"></canvas>
            <canvas id="anchorDevChart"></canvas>
            <div id="recenterStats" class="recenter-stats"></div>
          </div>
          <div class="chart-container">
            <h3>Slippage Distribution</h3>
            <canvas id="slippageChart"></canvas>
            <div class="trading-stats">
              <table id="tradingTable" class="data-table">
                <thead>
                  <tr>
                    <th>AMM</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>

      <footer class="footer">
        <p>Generated by EquilibraSwap Benchmark Framework</p>
      </footer>
    </div>

    <script src="charts.js?v=11"></script>
  </body>
</html>
