name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "simulator -> target"
      # Seconds-cheap and independent of npm/solc — fail fast on formatting
      # before the expensive compile/test steps.
      - run: cargo fmt --manifest-path simulator/Cargo.toml -- --check
      - run: npm ci
      - run: npm run compile
      # The legacy (non-viaIR) codegen is a distinct pipeline the pool must
      # also fit under the 16-slot stack limit on — compile it explicitly so
      # a stack-too-deep regression fails CI, not only local coverage runs.
      - run: SOLIDITY_COVERAGE=true npx hardhat compile
      - run: npm run test:ci
      - run: cargo test --manifest-path simulator/Cargo.toml --release
      - run: npm run audit:prod
